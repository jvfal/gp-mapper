{% load static %}
<!doctype html>
<html lang="{{ mapper_language }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#141719">
    <meta name="description" content="{{ mapper_page.description }}">
    <title>{{ mapper_page.title }}</title>
    <link rel="stylesheet" href="{% static 'mapper/mapper.css' %}">
    <script type="module" src="{% static 'mapper/mapper.js' %}"></script>
  </head>
  <body>
    <div id="mapper-root" data-catalog-url="{% url 'map-catalog' %}" data-csrf-token="{{ csrf_token }}"></div>
    <noscript>{{ mapper_page.noScript }}</noscript>
  </body>
</html>
